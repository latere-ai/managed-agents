name: ci

# The shared per-push gate, lateregate.yml, runs every check latere.ai/x/ci-gate
# defines over this repository. The tool is pinned in internal/gate rather than
# at the root, so the port's root module depends on nothing a consumer would
# see; gate_module runs it from there against the whole tree.
#
# The shared gate checks the root module. The modules job runs what it cannot
# reach: the adapters, the generator and the gate module are modules of their
# own, and `make validate` holds the three promises specific to this port (the
# root module depends on nothing, types.gen.go matches the schema, the
# generator builds and passes its tests).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner slots are better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # GitHub-hosted runners: the repository is public, and the organization's
    # own runner neither takes a public repository nor should run a fork's
    # pull request.
    uses: latere-ai/ci/.github/workflows/lateregate.yml@a003d32532e5c8b50e139449c9066edea42a9605
    with:
      runs_on: ubuntu-latest
      gate_module: internal/gate
      # golangci-lint's released binaries are built with Go 1.27.0, and they
      # cannot read the export data a newer 1.27 patch writes for the standard
      # library, so lint fails on every file. CI runs the toolchain the linter
      # was built with; a local `make lint` builds the linter with the local
      # toolchain and needs no such pin.
      go_version: "1.27.0"

  modules:
    name: modules beyond the root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - run: make modules
