name: ci

# The shared per-push pipeline. It probes this repository's Makefile and runs
# the targets it finds, so the gates are defined once, in the Makefile, and run
# the same on a workstation as they do here.
#
# The jobs this file used to spell out by hand are all still run. Vetting,
# testing and linting are the shared jobs; the three checks specific to this
# port -- that the root module still depends on nothing, that types.gen.go
# still matches the schema, and that the generator module is vetted and tested
# too -- are `make validate`, which the pipeline runs as a job of its own and
# which a developer can now run before pushing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner slots are better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # GitHub-hosted runners: the repository is public, and the organization's
    # own runner neither takes a public repository nor should run a fork's
    # pull request.
    uses: latere-ai/ci/.github/workflows/go-verify.yml@321d74d743f3a9573cb8f754dc8bd36638c75f0b # optional reports and isolated linter locks
    with:
      runs_on: ubuntu-latest
      test_os: '["ubuntu-latest"]'
      # golangci-lint's released binaries are built with Go 1.27.0, and they
      # cannot read the export data a newer 1.27 patch writes for the standard
      # library, so lint fails on every file. CI runs the toolchain the linter
      # was built with; a local `make lint` builds the linter with the local
      # toolchain and needs no such pin.
      go_version: "1.27.0"
