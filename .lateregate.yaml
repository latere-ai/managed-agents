# The per-push gate configuration for the managed-agent port. Every check runs
# from latere.ai/x/ci-gate, pinned in internal/gate/go.mod, so each one runs the
# same on a laptop as it does on a runner.
#
# The tool is pinned in a nested module rather than here at the root, because
# the port promises that adopting it costs nothing in a consumer's module
# graph. internal/gate/go.mod says why; the Makefile reaches the tool through
# it and points it back at this directory.

modules:
  # Each of these is a module of its own, so the root's ./... never reaches it:
  # the gate module that pins the tool, the schema generator, and the platform
  # adapter. They stay separate modules so a consumer of the contract never
  # sees their dependencies. Listing them has the suite vet, race and hold the
  # cover floor in each, and lint run in each, on a laptop and on CI alike.
  # The generator's tests also check that types.gen.go matches the schema.
  - internal/gate
  - internal/gen
  - latere

cover:
  # The default floor, ninety per package, is the figure CONTRIBUTING states.
  trim_prefix: latere.ai/x/managed-agents/
  exempt:
    # One entry, and the value is the reason; lateregate rejects an empty one.
    #
    # contracttest is the suite an adapter runs, not code this module runs. The
    # statements it does not reach are the convenience Run wrapper, which the
    # reference runtime does not call because it configures a Suite, and the
    # failure reports that fire only against an adapter that breaks a rule.
    # Covering those needs a deliberately non-conforming runtime, and this
    # module ships none. The exemption records that gap rather than hiding it.
    contracttest: >-
      the conformance suite's own failure paths, reachable only from an adapter
      that breaks a rule; the reference runtime conforms, so nothing here
      drives them

hermetic:
  # The two system directories, for two binaries the suite really runs. The root
  # module reaches only `go list`, which the toolchain provides. The gate module's
  # config test runs lateregate, which asks git which Go files the repository
  # tracks (/usr/bin). The platform adapter's token-command test runs the shell
  # that Command hands the command to, which is the feature under test (/bin).
  # Naming the directories keeps those two dependencies visible; with allow: []
  # both tests fail rather than skip.
  allow: [/usr/bin, /bin]

spec:
  # Every spec is numbered, appears in the index with the status it claims, and
  # every wikilink resolves. The status lived in prose before this gate, which
  # meant the index and the document could disagree with nobody noticing.
  numbered: true
  wikilinks: true
  # This tree's own words: `designed` for a decision taken whose work is not
  # finished, `built` once its acceptance criteria hold. The vocabulary is
  # closed so a typo becomes a failure rather than a new state nobody defined.
  status: [designed, built, archived]
  # `archived` is the terminal status. `built` is not: a shipped spec is the
  # live record of what the surface does and belongs where a reader looks.
  archive:
    dir: .archive
    statuses: [archived]

# The identity shape of the family: specs/infrastructure/identity.md in latere-ai/specs
identity:
  role: none

otel_client:
  # An adapter is a library: which tracing a caller's outbound calls carry is
  # the caller's choice, and the adapter modules depend on nothing beyond the
  # contract. Each takes the caller's *http.Client (Config.HTTP), which a
  # traced application instruments, and falls back to a plain one.
  skip: [latere]

license:
  # Apache-2.0, as the family's other public modules (pkg, cella, lux, topos)
  # are. Every Go file opens with the notice, the generated types included,
  # and `lateregate license -w` writes it where it is missing.
  spdx: Apache-2.0
  holder: Latere AI
